<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Shenandoah Heritage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="container">
    <nav style="display:flex; justify-content:space-between; align-items:center;">
      <ul style="display:flex; gap:20px; list-style:none; padding:0; margin:0;">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Programs</a></li>
        <li><a href="contact.html" class="cta">Join Us</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="container section contact-page">
  <h2>Contact Us</h2>
  <p>We'd love to hear from you.</p>

  <div class="contact-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:40px;">
    <div class="contact-info">
      <p><strong>Email:</strong> muttaiabuh@gmail.com</p>
      <p><strong>Hours:</strong> Mon - Fri: 9am – 5pm</p>
    </div>

    <!-- UPDATED FORM -->
    <form action="https://formsubmit.co/muttaiabuh@gmail.com" method="POST">
      
      <!-- Prevent Spam -->
      <input type="hidden" name="_captcha" value="false">

      <!-- Redirect After Submit -->
      <input type="hidden" name="_next" value="thankyou.html">

      <input type="text" name="name" placeholder="Full Name" required style="width:100%; padding:10px; margin-bottom:10px;">
      <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin-bottom:10px;">
      <input type="text" name="phone" placeholder="Phone Number" style="width:100%; padding:10px; margin-bottom:10px;">
      <textarea name="message" rows="4" placeholder="Message" style="width:100%; padding:10px; margin-bottom:10px;"></textarea>
      <button type="submit" style="padding:12px 20px;">Send Message</button>
    </form>
  </div>

</section>

<footer>
  <p>&copy; 2026 Shenandoah Heritage Homeschool Collective</p>
</footer>

<style>
@media (max-width: 768px) {

  nav {
    flex-direction: column;
    text-align: center;
  }

  nav ul {
    flex-direction: column;
    align-items: center;
  }

  .contact-grid {
    grid-template-columns: 1fr !important;
  }
}
</style>

</body>
</html>
