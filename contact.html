<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Shenandoah Heritage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">

<style>
:root{
    --primary: #38bdf8;
    --white: #ffffff;
}

/* CONTACT SECTION (New Layout Style Only) */
.contact-section {
    max-width: 900px;
    margin: 60px auto;
    background: var(--white);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.contact-section h2 {
    font-size: 36px;
    text-align: center;
    margin-bottom: 10px;
}

.contact-section p.subtitle {
    text-align: center;
    margin-bottom: 40px;
    color: #555;
}

.contact-info {
    margin-bottom: 30px;
    text-align: center;
}

.contact-info p {
    font-size: 18px;
    margin: 8px 0;
}

.contact-form {
    max-width: 600px;
    margin: auto;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.contact-form button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.contact-form button:hover {
    background: #0ea5e9;
}

/* MOBILE */
@media (max-width: 768px) {
    nav {
        flex-direction: column;
        text-align: center;
    }

    nav ul {
        flex-direction: column;
        align-items: center;
    }

    .contact-section {
        margin: 30px 15px;
        padding: 25px;
    }
}
</style>

</head>
<body>

<header>
  <div class="container">
    <nav style="display:flex; justify-content:space-between; align-items:center;">
      <ul style="display:flex; gap:20px; list-style:none; padding:0; margin:0;">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Programs</a></li>
        <li><a href="contact.html" class="cta">Join Us</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="contact-section">
  <h2>Contact Us</h2>
  <p class="subtitle">We'd love to hear from you.</p>

  <div class="contact-info">
      <p><strong>Email:</strong> muttaiabuh@gmail.com</p>
      <p><strong>Hours:</strong> Mon - Fri: 9am – 5pm</p>
  </div>

  <!-- FORM (WORKING) -->
  <form class="contact-form" action="https://formsubmit.co/muttaiabuh@gmail.com" method="POST">
      
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="thankyou.html">

      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="phone" placeholder="Phone Number">
      <textarea name="message" rows="5" placeholder="Message" required></textarea>
      <button type="submit">Send Message</button>
  </form>

</section>

<footer>
  <p>&copy; 2026 Shenandoah Heritage Homeschool Collective</p>
</footer>

</body>
</html>
